
# Split horizontally (side by side)
# map ctrl+shift+h launch --location=horizontal --cwd=current
# Split vertically (top/bottom)
# map ctrl+shift+v launch --location=vertical --cwd=current


# Pane navigation using kitten @ (official and stable method)
map ctrl+shift+h kitten @ focus-window left
map ctrl+shift+l kitten @ focus-window right
map ctrl+shift+k kitten @ focus-window up
map ctrl+shift+j kitten @ focus-window down

